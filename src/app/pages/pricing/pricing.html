<!-- Page Tarifs -->
<app-pricing-hero />

<div class="max-w-[1200px] mx-auto px-4 md:px-10 py-6 md:py-8">
  <!-- Grille des tarifs -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Colonne Reformer + Promo -->
    <div>
      <app-pricing-table [data]="reformer" />
<!--      <app-promo-badge />-->
    </div>

    <!-- Colonne Tapis -->
    <div>
      <app-pricing-table [data]="tapis" />
    </div>
  </div>

  <!-- Séparateur décoratif -->
  <div class="my-16 md:my-20 border-t border-border-light relative">
    <div class="absolute left-1/2 -top-4 -translate-x-1/2 bg-background-light px-6">
      <span class="material-symbols-outlined text-primary opacity-50">grain</span>
    </div>
  </div>

  <!-- Cartes cadeaux -->
  <div class="max-w-4xl mx-auto mb-8 bg-primary/10 border border-primary rounded-2xl p-6 text-center">
    <h2 class="text-xl font-bold text-text-light mb-2">Cartes cadeaux</h2>
    <p class="text-text-light text-sm">
      Offrez une carte cadeau ! Pour en acheter une, contactez-moi par
      <a routerLink="/contact" class="text-primary font-semibold underline">mail</a>,
      par téléphone ou directement sur place.
    </p>
    <p class="text-gray-500 text-xs mt-2">
      La séance d'essai offerte ne s'applique pas à l'achat d'une carte cadeau.
    </p>
  </div>

  <!-- Coaching individuel -->
  <div class="max-w-4xl mx-auto mb-16">
    <app-coaching-card />
  </div>

</div>
